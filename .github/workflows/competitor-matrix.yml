name: Competitor matrix conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competitor-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Four-stack matrix v4 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            competitors/*/package-lock.json
      - name: Install independently locked environments
        run: |
          npm install --global npm@11.19.0
          npm ci --no-audit --no-fund
          for profile in copilotkit assistant-ui vercel-ai-sdk; do
            npm ci --prefix "competitors/$profile" --workspaces=false --ignore-scripts --no-audit --no-fund
          done
      - name: Build stock Threadplane and isolated competitors
        run: |
          npm run build --workspace @chat-ui-bench/threadplane
          for profile in copilotkit assistant-ui vercel-ai-sdk; do
            npm run build --prefix "competitors/$profile" --workspaces=false
          done
      - name: Install pinned browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify matrix contracts and refusal controls
        run: node --test --test-concurrency=1 tools/competitor-comparison/matrix-*.node.mjs
      - name: Verify all 48 positive cells and the exact omission negative
        run: node tools/competitor-comparison/matrix-run-v4.mjs --verify --out "$RUNNER_TEMP/four-stack-matrix-v4"
      # Private fixtures, transcripts, DOM evidence and captured data are never uploaded.
