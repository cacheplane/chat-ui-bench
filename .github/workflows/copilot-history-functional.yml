name: Hosted unscored Copilot history functional diagnostic
run-name: copilot-history-functional-${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit expected on the selected workflow ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: copilot-history-functional
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      COPILOTKIT_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out original workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind the original run to the requested source
        run: |
          mkdir -p ci-logs "$RUNNER_TEMP/ci-evidence"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD | tee ci-logs/source-sha.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "TMPDIR=$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"

      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci 2>&1 | tee ci-logs/install.log

      - name: Build the source fixture contract
        run: npm run build --workspace @chat-ui-bench/contract 2>&1 | tee ci-logs/contract-build.log

      - name: Install pinned Chromium and system dependencies
        run: node node_modules/playwright/cli.js install --with-deps chromium 2>&1 | tee ci-logs/browser-install.log

      - name: Check the inert functional source preflight
        run: npm run diagnose:copilot-history-functional -- --preflight 2>&1 | tee ci-logs/preflight.log

      - name: Run one original functional diagnostic
        run: npm run diagnose:copilot-history-functional -- --browser --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --out "$RUNNER_TEMP/ci-evidence/copilot-history-functional-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>&1 | tee ci-logs/diagnostic.log

      - name: Retain original success or refusal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-history-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            ${{ runner.temp }}/ci-evidence/copilot-history-functional-run-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
