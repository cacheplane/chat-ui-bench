name: Hosted Copilot Tracker JSON A pilot
run-name: hosted-copilot-react-tracker-json-a-v2
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Same immutable source as independently qualified frontend and worker STATIC
        required: true
        type: string
      static_run_id:
        description: Original successful same-source production STATIC run attempt 1
        required: true
        type: string
      static_artifact_id:
        description: Independently qualified original STATIC artifact ID
        required: true
        type: string
      static_archive_sha256:
        description: Actual qualified STATIC archive SHA256
        required: true
        type: string
      static_root_sha256:
        description: Existing ROOT qualification report SHA256 assertion
        required: true
        type: string
      static_peer_sha256:
        description: Existing independent peer qualification report SHA256 assertion
        required: true
        type: string
      frontend_settings_sha256:
        description: SHA256 of the documented source config helper lock JSON tuple
        required: true
        type: string
      native_run_id:
        description: Independently qualified successful same-source ordinary-native V9 original run attempt 1
        required: true
        type: string
      native_artifact_id:
        description: Independently qualified successful same-source ordinary-native V9 original artifact ID
        required: true
        type: string
      native_archive_sha256:
        description: Actual whole qualified ordinary-native V9 archive SHA256
        required: true
        type: string
      native_root_sha256:
        description: Existing independent ROOT native qualification report SHA256 assertion
        required: true
        type: string
      native_peer_sha256:
        description: Existing independent peer native qualification report SHA256 assertion
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-copilot-tracker-a
  cancel-in-progress: false
jobs:
  tracker-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      HOSTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      HOSTED_STATIC_RUN_ID: ${{ inputs.static_run_id }}
      HOSTED_STATIC_ARTIFACT_ID: ${{ inputs.static_artifact_id }}
      HOSTED_STATIC_ARCHIVE_SHA256: ${{ inputs.static_archive_sha256 }}
      HOSTED_STATIC_ROOT_SHA256: ${{ inputs.static_root_sha256 }}
      HOSTED_STATIC_PEER_SHA256: ${{ inputs.static_peer_sha256 }}
      HOSTED_FRONTEND_SETTINGS_SHA256: ${{ inputs.frontend_settings_sha256 }}
      HOSTED_NATIVE_RUN_ID: ${{ inputs.native_run_id }}
      HOSTED_NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
      HOSTED_NATIVE_ARCHIVE_SHA256: ${{ inputs.native_archive_sha256 }}
      HOSTED_NATIVE_ROOT_SHA256: ${{ inputs.native_root_sha256 }}
      HOSTED_NATIVE_PEER_SHA256: ${{ inputs.native_peer_sha256 }}
      HOSTED_RUNNER_MARKER: ubuntu-24.04-hosted-copilot-tracker-a
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out immutable same-source pilot workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Provision exact pilot Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
      - name: Verify qualified same-source STATIC and ordinary-native prerequisites before dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-import-meta-resolve tools/hosted-copilot-mounted-bootstrap.mjs prepare
      - name: Capture locked install without scripts and verify pins and public resolutions
        run: node --experimental-import-meta-resolve tools/hosted-copilot-mounted-bootstrap.mjs install
      - name: Provision pinned browser only after installed and both prerequisite admissions
        run: node --experimental-import-meta-resolve tools/hosted-copilot-mounted-bootstrap.mjs provision
      - name: Run two serial original cases with Tracker JSON A capture without rebuilding
        id: runtime
        run: node --experimental-import-meta-resolve tools/hosted-copilot-mounted-bootstrap.mjs run
      - name: Admit pilot inventory after original runtime success
        id: artifacts
        if: always() && steps.runtime.outcome == 'success'
        run: node --experimental-import-meta-resolve tools/hosted-copilot-mounted-bootstrap.mjs inventory
      - name: Retain bounded pilot artifacts after inventory success
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: copilot-tracker-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/copilot-tracker-a-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
