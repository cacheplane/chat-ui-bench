name: Native input custody source controls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Run synthetic source controls and retain failure streams
        shell: bash
        run: |
          mkdir native-custody-unit-evidence
          set +e
          node --test tools/native-input-custody/run.node.mjs > native-custody-unit-evidence/stdout.bin 2> native-custody-unit-evidence/stderr.bin
          result=$?
          printf '%s\n' "$result" > native-custody-unit-evidence/exit-code.txt
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-input-custody-source-controls
          path: |
            native-custody-unit-evidence/
            tools/native-input-custody/
          if-no-files-found: error
          retention-days: 14
