name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Prepare evidence directories
        run: |
          mkdir -p ci-logs "$RUNNER_TEMP/ci-evidence"
          echo "TMPDIR=$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"

      - name: Set up npm 11
        run: |
          npm install --global npm@11 2>&1 | tee ci-logs/npm-setup.log
          node --version | tee ci-logs/node-version.log
          npm --version | tee ci-logs/npm-version.log

      - name: Install locked dependencies
        run: npm ci 2>&1 | tee ci-logs/install.log

      - name: Audit locked development and production dependencies
        run: npm audit --audit-level=high 2>&1 | tee ci-logs/audit.log

      - name: Build workspaces
        run: npm run build 2>&1 | tee ci-logs/build.log

      - name: Run unit tests
        run: npm test 2>&1 | tee ci-logs/unit.log

      - name: Test Node-only modified idle-host authentication and visibility controls
        run: node --test apps/threadplane/functional-build.node.mjs 2>&1 | tee ci-logs/threadplane-idle-host-source-controls.log

      - name: Test portable controlled H100 observer
        run: |
          set -o pipefail
          npm run test:h100-observer:portability 2>&1 | tee ci-logs/h100-observer-portability.log
          npm run test:h100-observer 2>&1 | tee ci-logs/h100-observer.log

      - name: Test portable unscored module-binding source controls
        run: npm run test:copilot-module-binding 2>&1 | tee ci-logs/copilot-module-binding-controls.log

      - name: Test portable unscored functional history source controls
        run: |
          set -o pipefail
          npm run test:copilot-history-functional 2>&1 | tee ci-logs/copilot-history-functional-controls.log
          node --test --test-concurrency=1 --test-timeout=30000 tools/copilot-history-functional/warm-runtime.node.mjs tools/copilot-history-functional/warm-selector.node.mjs tools/copilot-history-functional/warm-baseline.node.mjs tools/copilot-history-functional/warm-controller.node.mjs 2>&1 | tee -a ci-logs/copilot-history-functional-controls.log

      - name: Test source-only complete history preparation controls
        run: node tools/warm-h100-feasibility/run.mjs --test --out "$RUNNER_TEMP/ci-evidence/warm-h100-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee ci-logs/warm-h100-source-controls.log

      - name: Test Node-only warm chronology preparation controls
        run: node tools/warm-chronology-preparation/run.mjs --test --out "$RUNNER_TEMP/ci-evidence/warm-chronology-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee ci-logs/warm-chronology-source-controls.log

      - name: Test offline hosted failure inspector with Python 3.12 or newer
        run: |
          python3 --version 2>&1 | tee ci-logs/hosted-failure-inspector.log
          npm run test:hosted-failure-inspector 2>&1 | tee -a ci-logs/hosted-failure-inspector.log

      - name: Test offline retained scroll cause inspector with Python 3.12 or newer
        run: |
          python3 --version 2>&1 | tee ci-logs/scroll-cause-inspector.log
          npm run test:scroll-cause-inspector 2>&1 | tee -a ci-logs/scroll-cause-inspector.log

      - name: Typecheck workspaces
        run: npm run typecheck 2>&1 | tee ci-logs/typecheck.log

      - name: Typecheck annotation API isolation guards
        run: node node_modules/typescript/bin/tsc --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --skipLibCheck --types node packages/analyzer/src/browser-frame-annotation-fragments.test.ts 2>&1 | tee ci-logs/annotation-type-guards.log

      - name: Typecheck separate scroll-cause diagnostic sources
        run: npm run typecheck:scroll-cause 2>&1 | tee ci-logs/scroll-cause-typecheck.log

      - name: Preserve unit logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve controlled H100 observer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: h100-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/h100-observer*.log
            ${{ runner.temp }}/ci-evidence/h100-observer-*/
            ${{ runner.temp }}/ci-evidence/h100-portability-relocated-*/exclusive-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve module-binding source-control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-module-binding-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/copilot-module-binding-controls.log
            ${{ runner.temp }}/ci-evidence/copilot-module-binding-tests-*/run/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve functional history source-control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-history-functional-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/copilot-history-functional-controls.log
            ${{ runner.temp }}/ci-evidence/copilot-history-functional-tests-*/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve complete history preparation source controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warm-h100-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/warm-h100-source-controls.log
            ${{ runner.temp }}/ci-evidence/warm-h100-source-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve warm chronology preparation source controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warm-chronology-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/warm-chronology-source-controls.log
            ${{ runner.temp }}/ci-evidence/warm-chronology-source-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failure logs and browser evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-conformance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            ${{ runner.temp }}/ci-evidence/bench-browser-*/
            ${{ runner.temp }}/ci-evidence/threadplane-conformance-independent-*/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve comparison failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-comparison-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-evidence/comparison-forensic-*/
            ${{ runner.temp }}/ci-evidence/comparison-acquisition-original-*/
            ${{ runner.temp }}/ci-evidence/comparison-exact-source-*/
            ${{ runner.temp }}/ci-evidence/comparison-profile-output-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Serial browser conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Prepare evidence directories
        run: |
          mkdir -p ci-logs "$RUNNER_TEMP/ci-evidence"
          echo "TMPDIR=$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"

      - name: Set up npm 11
        run: |
          npm install --global npm@11 2>&1 | tee ci-logs/npm-setup.log
          node --version | tee ci-logs/node-version.log
          npm --version | tee ci-logs/npm-version.log

      - name: Install locked dependencies
        run: npm ci 2>&1 | tee ci-logs/install.log

      - name: Audit locked development and production dependencies
        run: npm audit --audit-level=high 2>&1 | tee ci-logs/audit.log

      - name: Build workspaces
        run: npm run build 2>&1 | tee ci-logs/build.log

      - name: Typecheck workspaces
        run: npm run typecheck 2>&1 | tee ci-logs/typecheck.log

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium 2>&1 | tee ci-logs/browser-install.log

      - name: Verify separate scroll-cause diagnostic build and loading
        run: npm run test:scroll-cause:build 2>&1 | tee ci-logs/scroll-cause-build.log

      - name: Run browser conformance sequentially
        run: npm run test:browser 2>&1 | tee ci-logs/browser.log

      - name: Run production Threadplane browser conformance
        run: npm run test:browser:threadplane 2>&1 | tee ci-logs/threadplane-browser.log

      - name: Run long-thread comparison browser conformance
        run: npm run test:browser:comparison 2>&1 | tee ci-logs/comparison-browser.log

      - name: Observe one unscored source-locked module binding and original closure
        run: npm run diagnose:copilot-module-binding -- --browser --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --out "$RUNNER_TEMP/ci-evidence/copilot-module-binding-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>&1 | tee ci-logs/copilot-module-binding.log

      - name: Preserve original module-binding outcome on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-module-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/copilot-module-binding.log
            ${{ runner.temp }}/ci-evidence/copilot-module-binding-run-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve browser logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve comparison browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/comparison-browser.log
            ${{ runner.temp }}/ci-evidence/comparison-browser-*/
            ${{ runner.temp }}/ci-evidence/comparison-browser-root-result-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Preserve failure logs and browser evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            ${{ runner.temp }}/ci-evidence/bench-browser-*/
            ${{ runner.temp }}/ci-evidence/threadplane-conformance-independent-*/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve comparison failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-evidence/comparison-forensic-*/
            ${{ runner.temp }}/ci-evidence/comparison-acquisition-original-*/
            ${{ runner.temp }}/ci-evidence/comparison-exact-source-*/
            ${{ runner.temp }}/ci-evidence/comparison-profile-output-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  modified-idle-host:
    name: Modified idle-host layout conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NG_BUILD_MAX_WORKERS: 2
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Prepare evidence directories
        run: |
          mkdir -p ci-logs "$RUNNER_TEMP/ci-evidence"
          echo "TMPDIR=$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"

      - name: Set up npm 11
        run: |
          npm install --global npm@11 2>&1 | tee ci-logs/npm-setup.log
          node --version | tee ci-logs/node-version.log
          npm --version | tee ci-logs/npm-version.log

      - name: Select isolated historical 0.3.2 dependencies for the modified profile
        run: |
          baseline=df05817b02c6408d205a618b4babc05bc7693c70
          git fetch --no-tags --depth=1 origin "$baseline"
          git show "$baseline:apps/threadplane/package.json" > apps/threadplane/package.json
          git show "$baseline:package-lock.json" > package-lock.json
          echo "Modified idle-host CSS v1 uses exact package.json and package-lock.json bytes from $baseline (Threadplane 0.3.2); current source and tests remain checked out." | tee ci-logs/historical-dependency-selection.log

      - name: Install locked historical dependencies
        run: npm ci 2>&1 | tee ci-logs/install.log

      - name: Audit locked development and production dependencies
        run: npm audit --audit-level=high 2>&1 | tee ci-logs/audit.log

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium 2>&1 | tee ci-logs/browser-install.log

      - name: Build and test modified idle-host layout
        run: npm run test:browser:threadplane:idle-host-css 2>&1 | tee ci-logs/threadplane-idle-host-browser.log

      - name: Preserve modified idle-host logs and functional build bookends
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modified-idle-host-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            ${{ runner.temp }}/ci-evidence/threadplane-conformance-independent-*/
          if-no-files-found: error
          retention-days: 7

  conformance:
    name: Instrumentation conformance
    needs: [unit, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Require both original jobs to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$UNIT_RESULT" = success && test "$BROWSER_RESULT" = success
