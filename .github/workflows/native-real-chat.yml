name: Native real chat source controls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked source dependencies
        run: npm ci
      - name: Build native owner prerequisites
        shell: bash
        run: |
          mkdir native-real-chat-unit-evidence
          set -euo pipefail
          npm run build --workspace @chat-ui-bench/contract 2>&1 | tee native-real-chat-unit-evidence/contract-build.log
          npm run build --workspace @chat-ui-bench/producer 2>&1 | tee native-real-chat-unit-evidence/producer-build.log
          npm run build --workspace @chat-ui-bench/analyzer 2>&1 | tee native-real-chat-unit-evidence/analyzer-build.log
          npm run build --workspace @chat-ui-bench/runner 2>&1 | tee native-real-chat-unit-evidence/runner-build.log
      - name: Run source controls without browser acquisition
        shell: bash
        run: |
          set +e
          node --test tools/native-real-chat/*.node.mjs > native-real-chat-unit-evidence/stdout.bin 2> native-real-chat-unit-evidence/stderr.bin
          result=$?
          printf '%s\n' "$result" > native-real-chat-unit-evidence/exit-code.txt
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-real-chat-source-controls
          path: |
            native-real-chat-unit-evidence/
            tools/native-real-chat/
          if-no-files-found: error
          retention-days: 14
