name: Hosted Copilot production static qualification
run-name: ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed exact actual source SHA
        required: true
        type: string
      release_id:
        description: Reviewed unused fixed production release identity
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-copilot-production
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      HOSTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      HOSTED_RELEASE_ID: ${{ inputs.release_id }}
      HOSTED_RUNNER_MARKER: ubuntu-24.04-hosted-copilot-production
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out exact released workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Provision exact native Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
      - name: Admit actual source and provider observations before dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/hosted-copilot-admission.mjs --initialize-evidence
      - name: Check actual native npm profile
        run: node tools/hosted-copilot-step.mjs profile
      - name: Install exact locked graph without scripts
        run: node tools/hosted-copilot-step.mjs install
      - name: Retain original full audit outcome
        run: node tools/hosted-copilot-step.mjs audit
      - name: Retain advisory high-threshold audit outcome
        run: node tools/hosted-copilot-step.mjs audit-high
      - name: Build contract declarations
        run: node tools/hosted-copilot-step.mjs contract
      - name: Check strict owned public consumer
        run: node tools/hosted-copilot-step.mjs consumer
      - name: Check strict inert controls
        run: node tools/hosted-copilot-step.mjs controls
      - name: Check full production helper source types
        run: node tools/hosted-copilot-step.mjs helpers
      - name: Retain original full vendor declaration failure
        run: node tools/hosted-copilot-step.mjs vendor
      - name: Build authentic default production browser entry
        run: node tools/hosted-copilot-step.mjs build
      - name: Inspect actual supported static graph with original parsers
        run: node tools/hosted-copilot-step.mjs inspect
      - name: Emit export-only native worker after frontend inspection
        run: node tools/hosted-copilot-step.mjs worker-build
      - name: Inspect worker syntax and public resolutions without importing it
        run: node tools/hosted-copilot-step.mjs worker-inspect
      - name: Admit actual original artifact file inventory
        id: artifacts
        if: always()
        run: node tools/hosted-copilot-admission.mjs --admit-artifacts
      - name: Retain original success or incomplete artifacts
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: copilot-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/copilot-production-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
