name: Pinned Perfetto authored import diagnostic
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  authored-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.20.0'
      - name: Run authored source controls with built-in Node modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/perfetto-import-evidence"
          set +e
          node --test tools/perfetto-import/run.node.mjs tools/perfetto-import/mainframe-lineage.node.mjs tools/perfetto-import/wheel-carrier.node.mjs tools/perfetto-import/wheel-graph.node.mjs tools/perfetto-import/callback-inventory.node.mjs > "$RUNNER_TEMP/perfetto-import-evidence/unit.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/unit.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/unit.exit-code"
          exit "$result"
      - name: Run compact V2 authored source controls
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test tools/perfetto-import/callback-inventory-compact-v2.node.mjs > "$RUNNER_TEMP/perfetto-import-evidence/compact-v2-unit.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/compact-v2-unit.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/compact-v2-unit.exit-code"
          exit "$result"
      - name: Fetch and verify explicitly pinned official Linux processor
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/perfetto-import-tool"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 --max-filesize 15885448 \
            https://commondatastorage.googleapis.com/perfetto-luci-artifacts/v59.1/linux-amd64/trace_processor_shell \
            --output "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell"
          test "$(stat -c '%s' "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell")" -eq 15885448
          printf '%s  %s\n' 2434129a3af4dc9e2034a476f7b76447b490975213e301769310d3bd0d5d6458 "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell"
      - name: Import maintained authored clock fixture with pinned production CLI
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/perfetto-import/smoke.mjs --processor "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" --out "$RUNNER_TEMP/perfetto-import-evidence/smoke" > "$RUNNER_TEMP/perfetto-import-evidence/smoke.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/smoke.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/smoke.exit-code"
          exit "$result"
      - name: Import independent authored callback inventory with pinned production CLI
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/perfetto-import/callback-inventory-smoke.mjs --processor "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" --out "$RUNNER_TEMP/perfetto-import-evidence/callback-smoke" > "$RUNNER_TEMP/perfetto-import-evidence/callback-smoke.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/callback-smoke.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/callback-smoke.exit-code"
          exit "$result"
      - name: Import independent compact V2 authored small and repeated-text fixtures
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/perfetto-import/callback-inventory-compact-v2-smoke.mjs --processor "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" --out "$RUNNER_TEMP/perfetto-import-evidence/compact-v2-smoke" > "$RUNNER_TEMP/perfetto-import-evidence/compact-v2-smoke.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/compact-v2-smoke.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/compact-v2-smoke.exit-code"
          exit "$result"
      - name: Verify compact browser-feedback SQL and original custody on new authored inputs
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/perfetto-import/feedback-observations-compact-smoke-v2.mjs --processor "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" --out "$RUNNER_TEMP/perfetto-import-evidence/feedback-compact-v2-smoke" > "$RUNNER_TEMP/perfetto-import-evidence/feedback-compact-v2-smoke.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/feedback-compact-v2-smoke.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/feedback-compact-v2-smoke.exit-code"
          exit "$result"
      - name: Verify explicit capacity V3 exports on new authored inputs
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/perfetto-import/feedback-observations-capacity-smoke-v3.mjs --processor "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" --out "$RUNNER_TEMP/perfetto-import-evidence/feedback-capacity-v3-smoke" > "$RUNNER_TEMP/perfetto-import-evidence/feedback-capacity-v3-smoke.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/feedback-capacity-v3-smoke.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/feedback-capacity-v3-smoke.exit-code"
          exit "$result"
      - name: Verify presentation coverage inventory on new private authored inputs
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/perfetto-import/presentation-coverage-smoke-v1.mjs --processor "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" --out "$RUNNER_TEMP/perfetto-presentation-coverage-authored-private" > "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage.exit-code"
          exit "$result"
      - name: Verify presentation coverage capacity V2 on new private authored dense input
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/perfetto-import/presentation-coverage-smoke-v2.mjs --processor "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" --out "$RUNNER_TEMP/perfetto-presentation-coverage-v2-authored-private" > "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage-v2.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage-v2.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage-v2.exit-code"
          exit "$result"
      - name: Verify presentation uint64 exporter V3 on new private authored dense input
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/perfetto-import/presentation-coverage-smoke-v3.mjs --processor "$RUNNER_TEMP/perfetto-import-tool/trace_processor_shell" --out "$RUNNER_TEMP/perfetto-presentation-coverage-v3-authored-private" > "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage-v3.stdout" 2> "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage-v3.stderr"
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/perfetto-import-evidence/presentation-coverage-v3.exit-code"
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: perfetto-authored-import-diagnostic
          path: ${{ runner.temp }}/perfetto-import-evidence/
          if-no-files-found: error
          retention-days: 14
